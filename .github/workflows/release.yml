name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/plumblint
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text("utf-8"))
          expected = "v" + data["project"]["version"]
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} does not match {expected!r}")
          print(f"release tag matches package version: {actual}")
          PY
      - name: Run release gate
        run: python tools/ci_checks.py
      - name: Build wheel and source distribution
        run: |
          python -m pip install --disable-pip-version-check "build==1.6.1"
          python -m build
      - name: Verify built package installs
        run: |
          python -m venv /tmp/plumblint-release-check
          /tmp/plumblint-release-check/bin/python -m pip install --disable-pip-version-check dist/*.whl
          cd /tmp
          /tmp/plumblint-release-check/bin/python - <<'PY'
          import importlib.metadata as metadata
          import plumblint

          installed = metadata.version("plumblint")
          assert installed == plumblint.__version__, (installed, plumblint.__version__)
          assert not metadata.requires("plumblint")
          print(f"installed plumblint {installed}; zero runtime dependencies")
          PY
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
